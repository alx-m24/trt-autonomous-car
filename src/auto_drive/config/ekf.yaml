# robot_localization EKF — fuses planar_move /odom with the IMU /imu into a
# clean, drift-resistant yaw estimate published on /odometry/filtered.
#
# Purpose for this stack: the corner maneuver in control_node dead-reckons the
# 90deg turn and terminates on INTEGRATED YAW. That yaw must be trustworthy, so
# we blend the wheel/planar odometry (good x/y, good short-term yaw) with the
# IMU (good yaw + yaw-rate, no slip drift). On the real RC car this is exactly
# where the wheel encoder + IMU earn their keep.
ekf_filter_node:
  ros__parameters:
    # Gazebo stamps /odom and /imu with sim (/clock) time; without this the EKF
    # runs on wall-clock and rejects every message as out-of-time -> no output.
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true               # planar track: zero z/roll/pitch

    # planar_move already broadcasts the odom->base_footprint TF, so the EKF
    # must NOT publish a competing transform (would cause TF flicker).
    publish_tf: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ── Source 0: planar_move odometry (/odom) ───────────────────────────────
    # Fuse absolute x, y, yaw  +  body vx and yaw-rate.
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # ── Source 1: IMU (/imu) ─────────────────────────────────────────────────
    # Fuse absolute yaw + yaw-rate. (Gazebo IMU reports absolute orientation
    # because initial_orientation_as_reference=false in the URDF.)
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
